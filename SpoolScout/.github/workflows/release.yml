name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Decode the keystore stored as a base64 GitHub secret.
      # If KEYSTORE_BASE64 is not set the release APK will be signed with the
      # debug key (useful for sideloading; not suitable for Play Store).
      - name: Set up release signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "Keystore decoded — release build will be signed."
          else
            echo "No KEYSTORE_BASE64 secret found — falling back to debug signing."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          SIGNING_ENABLED: ${{ env.SIGNING_ENABLED }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpoolScout ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: android/app/build/outputs/apk/release/app-release*.apk
